name: Bug report
description: The implementation crashes, rejects valid input, or disagrees with the specification.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction is worth more than a long
        description. Xdaptive is at Stage 0, so please say which part of the
        system you are testing.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Specification (docs/)
        - Adaptive IR (AIR)
        - Adaptive Compiler
        - Workspace runtime
        - Composition engine / capability resolver
        - Security / isolation
        - Desktop / UI
        - CLI (aos)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest AIR document, manifest, or input that shows the problem.
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      placeholder: "aos ..."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, including any diagnostic code.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit hash or version you built from.
    validations:
      required: false
  - type: dropdown
    id: authority
    attributes:
      label: Does the specification agree with you?
      description: The specification is the contract. See docs/README.md for the index.
      options:
        - The specification agrees; the implementation is wrong
        - The specification disagrees; I think the specification is wrong
        - The specification is silent
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues for a duplicate.
          required: true
        - label: This is not a security issue. Security reports go through SECURITY.md.
          required: true
